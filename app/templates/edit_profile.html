{% extends "layout.html" %} {% block content %}

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg">
        <div class="card-body">
          <h2 class="text-center mb-4">
            <i class="fas fa-user-edit"></i> Edytuj profil
          </h2>

          <form method="POST">
            <div class="mb-3">
              <label for="user_name" class="form-label">
                <i class="fas fa-user"></i> Imię
              </label>
              <input
                type="text"
                class="form-control"
                id="user_name"
                name="user_name"
                value="{{ user.user_name }}"
                required
              />
            </div>

            <div class="mb-3">
              <label for="last_name" class="form-label">
                <i class="fas fa-user"></i> Nazwisko
              </label>
              <input
                type="text"
                class="form-control"
                id="last_name"
                name="last_name"
                value="{{ user.last_name }}"
                required
              />
            </div>

            <div class="mb-3">
              <label for="email_address" class="form-label">
                <i class="fas fa-envelope"></i> E-mail
              </label>
              <input
                type="email"
                class="form-control"
                id="email_address"
                name="email_address"
                value="{{ user.email_address }}"
                required
              />
            </div>

            <div class="mb-3 position-relative">
              <label for="password" class="form-label">
                <i class="fas fa-lock"></i> Nowe hasło (opcjonalne)
              </label>
              <div class="input-group">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  autocomplete="new-password"
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  id="togglePassword"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Zapisz zmiany
              </button>
              <a
                href="{{ url_for('profile', user_id=user.id_user) }}"
                class="btn btn-secondary"
              >
                <i class="fas fa-times"></i> Anuluj
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Skrypt do ukrywania/pokazywania hasła -->
<script>
  document
    .getElementById("togglePassword")
    .addEventListener("click", function () {
      const passwordInput = document.getElementById("password");
      const icon = this.querySelector("i");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        passwordInput.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    });
</script>

{% endblock %}
