{% extends "layout.html" %} {% block content %}
<div class="container mt-4">
  <h2 class="text-center">Dodaj nowego użytkownika</h2>
  <form method="POST">
    <div class="mb-3">
      <label for="user_name" class="form-label">Imię</label>
      <input
        type="text"
        class="form-control"
        id="user_name"
        name="user_name"
        required
      />
    </div>

    <div class="mb-3">
      <label for="last_name" class="form-label">Nazwisko</label>
      <input
        type="text"
        class="form-control"
        id="last_name"
        name="last_name"
        required
      />
    </div>

    <div class="mb-3">
      <label for="gender" class="form-label">Płeć</label>
      <select class="form-select" id="gender" name="gender" required>
        <option value="M">Mężczyzna</option>
        <option value="K">Kobieta</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="email_address" class="form-label">E-mail</label>
      <input
        type="email"
        class="form-control"
        id="email_address"
        name="email_address"
        required
      />
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Hasło</label>
      <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        required
      />
    </div>

    <div class="mb-3">
      <label for="role_id" class="form-label">Rola</label>
      <select class="form-select" id="role_id" name="role_id" required>
        {% for role in roles %}
        <option value="{{ role.id_role }}">{{ role.role_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="club_id" class="form-label">Klub</label>
      <select class="form-select" id="club_id" name="club_id" required>
        {% for club in clubs %}
        <option value="{{ club.id_club }}">{{ club.club_name }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">
      Dodaj użytkownika
    </button>
  </form>
</div>
{% endblock %}
